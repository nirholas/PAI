name: Deploy website (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/flash.sh"
      - "scripts/flash.ps1"
      - "scripts/try.sh"
      - "scripts/try.ps1"
      - "scripts/gen-imager-manifest.mjs"
      - "scripts/validate-imager-manifest.mjs"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch:

concurrency:
  group: pages-pai-direct
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Deploy to pai-direct
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.157.0 pages deploy dist --project-name=pai-direct --branch=main --commit-dirty=true
